# enable-ssh-support: day-to-day SSH auth is handled by the Bitwarden SSH
# agent, but keeping this enabled lets gpg-agent offer the YubiKey's
# authentication subkey over the SSH protocol — a useful fallback when the
# Bitwarden agent is unavailable (point SSH_AUTH_SOCK at gpg-agent's socket).
enable-ssh-support
pinentry-program /opt/homebrew/bin/pinentry-mac
default-cache-ttl 600
max-cache-ttl 7200
